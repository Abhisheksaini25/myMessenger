<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>Happy Birthday 🎂</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎂</text></svg>">
  
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="stage">
  <canvas id="bgCanvas"></canvas>
  <canvas id="fxBackCanvas"></canvas>

  <div id="contentLayer">

    <!-- Initial Start Screen -->
    <section id="questionsUI" class="ui-layer hidden">
      <div id="colorQuestion" class="question-col hidden">
        <h2 class="question-title">What is your favorite color?</h2>
        <div id="colorPickerHost"></div>
      </div>
      <div id="startQuestion" class="question-col hidden">
        <h2 class="question-title">Ready?</h2>
        <button id="startBtn" class="btn btn-accent btn-question interactive" style="font-size: 24px; padding: 12px 32px; font-family: 'StylishFont', cursive;">Start Celebration</button>
      </div>
    </section>

    <!-- ═══ Birthday text ═══ -->
    <div id="birthdayText" class="hidden">
      <div id="revealHappy" class="reveal-line"></div>
      <div id="revealBirthday" class="reveal-line"></div>
      <div id="revealName" class="reveal-line name-line"></div>
    </div>

    <!-- Cake scene -->
    <div id="cakeScene" class="hidden">
      <div id="cakeWrap">
        <div class="cake-svg-wrap" style="position: relative;">
          <img id="cakeSvg" src="assets/birthday_cake.png" alt="Birthday cake" style="width: 100%; height: auto;">
          <svg id="flameGroupSvg" xmlns="http://www.w3.org/2000/svg" viewBox="-20 -45 40 50" style="position: absolute; width: 30px; height: 40px; top: -3%; left: 50%; transform: translate(-50%, -50%); pointer-events: none; z-index: 10;">
            <defs>
              <radialGradient id="flameGrad" cx="0.5" cy="0.75" r="0.75">
                <stop offset="0%" stop-color="#fff9c4"/>
                <stop offset="35%" stop-color="#ffe082"/>
                <stop offset="70%" stop-color="#ff9d3c"/>
                <stop offset="100%" stop-color="#ff6d00" stop-opacity="0.15"/>
              </radialGradient>
              <filter id="flameBlur" x="-80%" y="-80%" width="260%" height="260%">
                <feGaussianBlur stdDeviation="3.2"/>
              </filter>
            </defs>
            <g id="flameGroup">
              <circle id="flameGlow" cx="0" cy="0" r="17" fill="#ffb74d" opacity="0.22" filter="url(#flameBlur)"/>
              <path id="flameOuter" d="M0 0 C7 -6 6 -17 0 -27 C-6 -17 -7 -6 0 0 Z" fill="url(#flameGrad)"/>
              <path id="flameInner" d="M0 -1 C3.5 -5 3 -11 0 -17 C-3 -11 -3.5 -5 0 -1 Z" fill="#fffde7" opacity="0.95"/>
            </g>
          </svg>
        </div>
        <div id="cakeHint" style="margin-top: 10px;">Tap the cake to blow out the candle</div>
      </div>
    </div>

    <!-- ═══ Photo carousel ═══ -->
    <div id="carousel" class="hidden">
      <div class="polaroid">
        <div class="photo-area">
          <img id="photoA" alt="Memory photo">
          <img id="photoB" alt="Memory photo">
        </div>
      </div>
    </div>

    <!-- ═══ Settings dialog ═══ -->
    <div id="settingsDialog" class="overlay hidden">
      <div class="card settings-card">
        <h2 class="card-title">Birthday Settings</h2>
        <hr class="divider">
        <p class="row-label" style="text-align: center; font-size: 14px; opacity: 0.8; font-weight: normal; margin-bottom: 8px;">There is no need to add image, you can just continue, this is just additional thing</p>
        <div class="field">
          <label for="nameInput">Birthday Name</label>
          <input id="nameInput" class="interactive" type="text" maxlength="20" autocomplete="off" spellcheck="false">
        </div>
        <button id="galleryBtn" class="btn btn-base full interactive">🖼&nbsp; Add From Gallery</button>
        <button id="continueBtn" class="btn btn-accent full interactive">Continue ✨</button>
        <button id="resetBtn" class="link-btn interactive">↺ Start over</button>
      </div>
    </div>



    <!-- ═══ Final message popup ═══ -->
    <div id="finalPopup" class="overlay hidden">
      <div class="card final-card">
        <div class="egg-emoji">🎁</div>
        <div id="finalWords" class="final-words"></div>
        <button id="finalCloseBtn" class="btn btn-base hidden">Close</button>
      </div>
    </div>

    <div id="toast" class="hidden"></div>
    <div id="soundHint" class="hidden">Tap anywhere for sound 🔊</div>
  </div>

  <canvas id="fxFrontCanvas"></canvas>
</div>

<input type="file" id="galleryInput" accept="image/*" multiple hidden>

<script src="js/constants.js"></script>
<script src="js/colors.js"></script>
<script src="js/storage.js"></script>
<script src="js/star.js"></script>
<script src="js/firework.js"></script>
<script src="js/confetti.js"></script>
<script src="js/balloon.js"></script>
<script src="js/trail.js"></script>
<script src="js/sound.js"></script>
<script src="js/wheel.js"></script>
<script src="js/placeholders.js"></script>
<script src="js/main.js"></script>
</body>
</html>
