<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Private Messenger — Admin Dashboard</title>
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- HTMX CDN -->
    <script src="https://unpkg.com/htmx.org@1.9.12"></script>
    <!-- Custom Dashboard CSS -->
    <link rel="stylesheet" href="/static/css/dashboard.css">
</head>
<body>
    <!-- Top Emerald Accent Bar (WhatsApp Web style) -->
    <div class="app-background-accent"></div>

    <!-- Main WhatsApp Web App Container -->
    <div class="app-container">
        <!-- Sidebar: Conversation List -->
        <aside class="sidebar">
            <header class="sidebar-header">
                <div class="user-profile-badge">
                    <div class="avatar admin-avatar">AD</div>
                    <div class="profile-info">
                        <span class="user-name">Admin Dashboard</span>
                        <span class="user-role">Private Messenger</span>
                    </div>
                </div>
                <div class="sidebar-actions" style="display: flex; gap: 8px;">
                    <a href="/dashboard/simulator/" class="action-btn" title="Open Friend POV Simulator (Test Mobile App)" target="_blank">
                        📱
                    </a>
                    <a href="/admin/" class="action-btn" title="Open Django Admin" target="_blank">
                        <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none">
                            <path d="M12 2a10 10 0 1 0 10 10A10 10 0 0 0 12 2zm0 18a8 8 0 1 1 8-8 8 8 0 0 1-8 8z"></path>
                            <path d="M12 8v4l3 3"></path>
                        </svg>
                    </a>
                </div>
            </header>

            <!-- Search Bar -->
            <div class="search-bar-container">
                <div class="search-input-wrapper">
                    <svg class="search-icon" viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
                        <path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
                    </svg>
                    <input type="text"
                           name="q"
                           value="{{ search_query }}"
                           placeholder="Search conversations..."
                           class="search-input"
                           hx-get="/dashboard/conversations/"
                           hx-trigger="keyup changed delay:250ms, search"
                           hx-target="#conversation-list">
                </div>
            </div>

            <!-- Conversation Items (Auto-refresh every 3 seconds via HTMX) -->
            <div id="conversation-list"
                 class="conversation-list"
                 hx-get="/dashboard/conversations/"
                 hx-trigger="every 3s"
                 hx-include="[name='q']">
                {% include "dashboard/partials/sidebar_list.html" %}
            </div>
        </aside>

        <!-- Main Area: Chat Window -->
        <main id="chat-window-container" class="main-chat-area">
            <div class="empty-chat-placeholder">
                <div class="empty-state-card">
                    <div class="empty-icon-wrapper">
                        <svg viewBox="0 0 24 24" width="64" height="64" fill="currentColor">
                            <path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm0 14H6l-2 2V4h16v12z"/>
                        </svg>
                    </div>
                    <h1>Private Messenger</h1>
                    <p>Select a friend from the conversation list on the left to start chatting.<br>Messages are end-to-end synced with built-in Android APK clients.</p>
                    <div class="security-badge">
                        <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
                            <path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm-2 16l-4-4 1.41-1.41L10 14.17l6.59-6.59L18 9l-8 8z"/>
                        </svg>
                        <span>End-to-End Secure One-to-One Architecture</span>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Minimal Vanilla JS for UX enhancements -->
    <script>
        function scrollToBottom() {
            const container = document.getElementById('messages-scroll-area');
            if (container) {
                container.scrollTop = container.scrollHeight;
            }
        }

        // Auto-scroll on HTMX swaps inside chat messages
        document.body.addEventListener('htmx:afterSwap', function(event) {
            if (event.detail.target.id === 'messages-container' || event.detail.target.id === 'chat-window-container') {
                scrollToBottom();
            }
        });

        // Handle Enter key in chat textarea without shift
        document.body.addEventListener('keydown', function(e) {
            if (e.target && e.target.id === 'message-input-textarea') {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    const form = document.getElementById('message-send-form');
                    if (form && e.target.value.trim().length > 0) {
                        htmx.trigger(form, 'submit');
                    }
                }
            }
        });
    </script>
</body>
</html>
