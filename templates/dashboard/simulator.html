<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Friend POV Smartphone Simulator — Private Messenger</title>
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/dashboard.css">
    <style>
        :root {
            --sim-bg: #0b141a;
            --sim-card: #111b21;
            --sim-card-2: #202c33;
            --sim-border: #222d34;
            --sim-border-hover: #2a3942;
            --sim-text: #e9edef;
            --sim-muted: #8696a0;
            --sim-accent: #00a884;
            --sim-accent-dark: #005c4b;
            --sim-bubble-in: #202c33;
            --sim-bubble-out: #005c4b;
            --sim-blue: #3b82f6;
            --sim-amber: #f59e0b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--sim-bg);
            color: var(--sim-text);
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            padding: 20px 14px 40px;
            overflow-y: auto;
        }

        /* ── Top Deck Controls ── */
        .sim-deck {
            width: 100%;
            max-width: 480px;
            background: var(--sim-card);
            border: 1px solid var(--sim-border);
            border-radius: 16px;
            padding: 16px 20px;
            margin-bottom: 22px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .deck-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--sim-border);
        }

        .deck-title {
            font-size: 15px;
            font-weight: 700;
            color: var(--sim-text);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .live-status-pill {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 11px;
            font-weight: 600;
            padding: 3px 8px;
            border-radius: 999px;
            background: rgba(0, 168, 132, 0.15);
            color: var(--sim-accent);
            border: 1px solid rgba(0, 168, 132, 0.3);
        }

        .live-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--sim-accent);
            animation: pulse-dot 1.8s infinite;
        }

        @keyframes pulse-dot {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(0.85); }
        }

        .deck-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            flex-wrap: wrap;
        }

        .deck-field-label {
            font-size: 12px;
            font-weight: 600;
            color: var(--sim-muted);
            text-transform: uppercase;
            letter-spacing: 0.4px;
        }

        .friend-selector, .mode-selector {
            background: var(--sim-card-2);
            color: var(--sim-text);
            border: 1px solid var(--sim-border-hover);
            padding: 7px 12px;
            border-radius: 8px;
            font-size: 13px;
            font-family: inherit;
            outline: none;
            cursor: pointer;
            flex: 1;
            min-width: 180px;
            transition: border-color 0.2s;
        }

        .friend-selector:focus, .mode-selector:focus {
            border-color: var(--sim-accent);
        }

        .deck-api-chip {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(0, 0, 0, 0.3);
            border: 1px dashed var(--sim-border-hover);
            border-radius: 8px;
            padding: 6px 10px;
            font-size: 11px;
            color: var(--sim-muted);
        }

        .api-key-code {
            font-family: monospace;
            color: var(--sim-accent);
            font-weight: 600;
            max-width: 240px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .copy-key-btn {
            background: transparent;
            border: none;
            color: var(--sim-muted);
            cursor: pointer;
            font-size: 11px;
            padding: 2px 6px;
            border-radius: 4px;
            transition: color 0.2s;
        }

        .copy-key-btn:hover {
            color: var(--sim-text);
        }

        /* ── Smartphone Mockup Frame ── */
        .phone-wrapper {
            position: relative;
            padding: 4px;
            background: linear-gradient(145deg, #2a3942, #111b21);
            border-radius: 46px;
            box-shadow: 0 24px 60px rgba(0, 0, 0, 0.7), 0 0 0 2px #33444f;
        }

        .phone-frame {
            width: 390px;
            height: 760px;
            background: #0b141a;
            border-radius: 42px;
            border: 8px solid #182229;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        /* Smartphone Hardware Details */
        .phone-notch {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 140px;
            height: 22px;
            background: #182229;
            border-bottom-left-radius: 14px;
            border-bottom-right-radius: 14px;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }

        .notch-camera {
            width: 9px;
            height: 9px;
            border-radius: 50%;
            background: #0b141a;
            border: 1px solid #202c33;
        }

        .notch-speaker {
            width: 38px;
            height: 3px;
            border-radius: 3px;
            background: #2a3942;
        }

        /* Top System Status Bar */
        .system-status-bar {
            height: 30px;
            padding: 6px 18px 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 11px;
            font-weight: 600;
            color: var(--sim-text);
            z-index: 90;
            background: var(--sim-card);
            user-select: none;
        }

        .status-time {
            letter-spacing: 0.2px;
        }

        .status-icons {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 10px;
            opacity: 0.85;
        }

        /* ── SCREEN 1: Mobile Inbox Screen ── */
        .screen-view {
            display: flex;
            flex-direction: column;
            flex: 1;
            height: calc(100% - 30px);
            overflow: hidden;
        }

        .inbox-header {
            background: var(--sim-card);
            padding: 10px 16px;
            border-bottom: 1px solid var(--sim-border);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .app-brand {
            font-size: 17px;
            font-weight: 700;
            color: var(--sim-accent);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .inbox-actions {
            display: flex;
            align-items: center;
            gap: 12px;
            color: var(--sim-muted);
            font-size: 14px;
        }

        /* Filter Tabs */
        .tabs-row {
            display: flex;
            background: var(--sim-card);
            border-bottom: 1px solid var(--sim-border);
            padding: 0 10px;
        }

        .tab-btn {
            flex: 1;
            background: none;
            border: none;
            color: var(--sim-muted);
            padding: 10px 4px;
            font-size: 12.5px;
            font-weight: 600;
            cursor: pointer;
            border-bottom: 2px solid transparent;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .tab-btn.active {
            color: var(--sim-accent);
            border-bottom-color: var(--sim-accent);
        }

        .tab-badge {
            font-size: 10px;
            padding: 1px 6px;
            border-radius: 999px;
            background: var(--sim-card-2);
            color: var(--sim-muted);
        }

        .tab-btn.active .tab-badge {
            background: rgba(0, 168, 132, 0.2);
            color: var(--sim-accent);
        }

        /* Search input inside phone */
        .search-box {
            padding: 8px 12px;
            background: var(--sim-bg);
            border-bottom: 1px solid var(--sim-border);
        }

        .search-input-wrap {
            display: flex;
            align-items: center;
            gap: 8px;
            background: var(--sim-card-2);
            border-radius: 8px;
            padding: 6px 12px;
        }

        .search-input {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--sim-text);
            font-size: 13px;
            outline: none;
        }

        .search-input::placeholder {
            color: var(--sim-muted);
        }

        /* Conversations List */
        .conversations-scroll {
            flex: 1;
            overflow-y: auto;
            background: var(--sim-bg);
        }

        .chat-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            border-bottom: 1px solid rgba(34, 45, 52, 0.5);
            cursor: pointer;
            transition: background 0.15s;
        }

        .chat-item:hover, .chat-item:active {
            background: var(--sim-card);
        }

        .item-avatar {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 15px;
            color: #fff;
            flex-shrink: 0;
            position: relative;
        }

        .item-avatar.admin {
            background: linear-gradient(135deg, #00a884, #005c4b);
            box-shadow: 0 2px 8px rgba(0, 168, 132, 0.3);
        }

        .item-avatar.peer {
            background: linear-gradient(135deg, #3b82f6, #1d4ed8);
        }

        .item-avatar.group {
            background: linear-gradient(135deg, #10b981, #047857);
            border-radius: 12px;
        }

        .avatar-badge-icon {
            position: absolute;
            bottom: -2px;
            right: -2px;
            font-size: 11px;
            background: var(--sim-card);
            border-radius: 50%;
            padding: 1px;
        }

        .item-content {
            flex: 1;
            min-width: 0;
        }

        .item-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 3px;
        }

        .item-name {
            font-size: 14.5px;
            font-weight: 600;
            color: var(--sim-text);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .item-time {
            font-size: 11px;
            color: var(--sim-muted);
            white-space: nowrap;
        }

        .item-bottom {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .item-snippet {
            font-size: 12.5px;
            color: var(--sim-muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 210px;
        }

        .unread-badge {
            background: var(--sim-accent);
            color: #0b141a;
            font-weight: 700;
            font-size: 10px;
            padding: 2px 6px;
            border-radius: 999px;
            min-width: 18px;
            text-align: center;
        }

        .type-tag {
            font-size: 9.5px;
            font-weight: 700;
            padding: 2px 5px;
            border-radius: 4px;
            text-transform: uppercase;
        }

        .type-tag.admin { background: rgba(0, 168, 132, 0.18); color: var(--sim-accent); }
        .type-tag.peer { background: rgba(59, 130, 246, 0.18); color: #60a5fa; }
        .type-tag.group { background: rgba(16, 185, 129, 0.18); color: #34d399; }

        .empty-inbox {
            padding: 30px 20px;
            text-align: center;
            color: var(--sim-muted);
            font-size: 13px;
            line-height: 1.5;
        }

        /* ── SCREEN 2: Mobile Chat Room View ── */
        .chat-header {
            height: 56px;
            background: var(--sim-card-2);
            display: flex;
            align-items: center;
            padding: 0 12px;
            gap: 8px;
            border-bottom: 1px solid var(--sim-border);
            z-index: 50;
        }

        .btn-back {
            background: none;
            border: none;
            color: var(--sim-text);
            cursor: pointer;
            padding: 6px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.15s;
        }

        .btn-back:hover {
            background: rgba(255, 255, 255, 0.08);
        }

        .chat-target-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 13px;
            color: #fff;
            flex-shrink: 0;
        }

        .chat-target-avatar.admin { background: linear-gradient(135deg, #00a884, #005c4b); }
        .chat-target-avatar.peer { background: linear-gradient(135deg, #3b82f6, #1d4ed8); }
        .chat-target-avatar.group { background: linear-gradient(135deg, #10b981, #047857); border-radius: 10px; }

        .chat-header-info {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
        }

        .chat-header-name {
            font-size: 14.5px;
            font-weight: 600;
            color: var(--sim-text);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .chat-header-sub {
            font-size: 11px;
            color: var(--sim-muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .mobile-chat-body {
            flex: 1;
            overflow-y: auto;
            padding: 16px 14px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            background-color: var(--sim-bg);
            background-image: radial-gradient(rgba(34, 45, 52, 0.4) 1px, transparent 0);
            background-size: 20px 20px;
        }

        .date-chip {
            align-self: center;
            background: var(--sim-card-2);
            color: var(--sim-muted);
            font-size: 10.5px;
            font-weight: 600;
            padding: 3px 10px;
            border-radius: 6px;
            margin: 4px 0 8px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .mob-msg {
            max-width: 80%;
            padding: 7px 11px;
            border-radius: 8px;
            font-size: 13.5px;
            line-height: 1.4;
            position: relative;
            word-wrap: break-word;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.25);
        }

        .mob-msg.outgoing {
            align-self: flex-end;
            background-color: var(--sim-bubble-out);
            color: var(--sim-text);
            border-top-right-radius: 2px;
        }

        .mob-msg.incoming {
            align-self: flex-start;
            background-color: var(--sim-bubble-in);
            color: var(--sim-text);
            border-top-left-radius: 2px;
        }

        .msg-sender-tag {
            font-size: 11px;
            font-weight: 700;
            margin-bottom: 2px;
            color: #34d399;
        }

        .mob-meta {
            font-size: 10px;
            color: rgba(255, 255, 255, 0.6);
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 4px;
            margin-top: 3px;
        }

        .check-ticks {
            color: #53bdeb;
            font-size: 11px;
            line-height: 1;
        }

        .mobile-footer {
            padding: 8px 10px 10px;
            background: var(--sim-card-2);
            border-top: 1px solid var(--sim-border);
        }

        .mobile-input-row {
            display: flex;
            align-items: center;
            gap: 8px;
            background: #2a3942;
            border-radius: 24px;
            padding: 4px 10px 4px 14px;
        }

        .mobile-input {
            flex: 1;
            border: none;
            background: transparent;
            color: var(--sim-text);
            font-size: 13.5px;
            font-family: inherit;
            outline: none;
            padding: 6px 0;
        }

        .mobile-input::placeholder {
            color: var(--sim-muted);
        }

        .mobile-send-btn {
            background: var(--sim-accent);
            border: none;
            color: #0b141a;
            cursor: pointer;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.15s, opacity 0.15s;
            flex-shrink: 0;
        }

        .mobile-send-btn:hover {
            opacity: 0.9;
            transform: scale(1.05);
        }

        .mobile-send-btn svg {
            margin-left: 2px;
        }

        /* ── External Navigation Links ── */
        .bottom-nav-links {
            display: flex;
            gap: 14px;
            margin-top: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .nav-chip {
            color: var(--sim-muted);
            text-decoration: none;
            font-size: 13px;
            background: var(--sim-card);
            border: 1px solid var(--sim-border);
            padding: 6px 14px;
            border-radius: 999px;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .nav-chip:hover {
            color: var(--sim-accent);
            border-color: var(--sim-accent);
            text-decoration: none;
        }
    </style>
</head>
<body>

    <!-- Desktop Control Deck -->
    <section class="sim-deck">
        <div class="deck-header">
            <div class="deck-title">
                <span>📱</span> Friend POV Simulator
            </div>
            <div class="live-status-pill">
                <span class="live-dot"></span>
                <span id="liveStatusText">Live Polling (3s)</span>
            </div>
        </div>

        <div class="deck-row">
            <label class="deck-field-label" for="friendSelect">Simulated Friend:</label>
            <select id="friendSelect" class="friend-selector" onchange="switchFriend()">
                {% for friend in friends %}
                <option value="{{ friend.user_id }}" data-key="{{ friend.api_key }}" data-name="{{ friend.display_name }}" {% if friend.user_id == active_friend.user_id %}selected{% endif %}>
                    {{ friend.display_name }} ({{ friend.user_id }})
                </option>
                {% endfor %}
            </select>
        </div>

        <div class="deck-row">
            <label class="deck-field-label" for="modeSelect">Simulator Mode:</label>
            <select id="modeSelect" class="mode-selector" onchange="switchMode()">
                <option value="full" selected>📱 Full App (Inbox & All Chats)</option>
                <option value="direct">💬 Direct Admin Chat (Classic)</option>
            </select>
        </div>

        <div class="deck-api-chip">
            <span>API Key: <code id="displayApiKey" class="api-key-code">{{ active_friend.api_key }}</code></span>
            <button class="copy-key-btn" onclick="copyApiKey()" title="Copy API key to clipboard">📋 Copy</button>
        </div>
    </section>

    <!-- Smartphone Mockup -->
    <div class="phone-wrapper">
        <div class="phone-frame">
            <!-- Hardware Notch -->
            <div class="phone-notch">
                <div class="notch-camera"></div>
                <div class="notch-speaker"></div>
            </div>

            <!-- Top System Status Bar -->
            <div class="system-status-bar">
                <span id="statusBarClock" class="status-time">12:00</span>
                <div class="status-icons">
                    <span>5G</span>
                    <span>📶</span>
                    <span>🔋 92%</span>
                </div>
            </div>

            <!-- ── SCREEN 1: Inbox / Chats List Screen ── -->
            <div id="screenInbox" class="screen-view">
                <div class="inbox-header">
                    <div class="app-brand">
                        <span>💬</span> GLM Messenger
                    </div>
                    <div class="inbox-actions">
                        <span style="font-size: 12px; color: var(--sim-muted);" id="inboxFriendName">{{ active_friend.display_name }}</span>
                    </div>
                </div>

                <!-- Tabs Row -->
                <div class="tabs-row">
                    <button class="tab-btn active" onclick="setTab('all')" id="tabAll">
                        All <span id="badgeAll" class="tab-badge">0</span>
                    </button>
                    <button class="tab-btn" onclick="setTab('peers')" id="tabPeers">
                        Peers <span id="badgePeers" class="tab-badge">0</span>
                    </button>
                    <button class="tab-btn" onclick="setTab('groups')" id="tabGroups">
                        Groups <span id="badgeGroups" class="tab-badge">0</span>
                    </button>
                </div>

                <!-- Search Input -->
                <div class="search-box">
                    <div class="search-input-wrap">
                        <span style="color: var(--sim-muted); font-size: 13px;">🔍</span>
                        <input type="text" id="searchInput" class="search-input" placeholder="Search conversations..." oninput="handleSearch()">
                    </div>
                </div>

                <!-- Conversations List -->
                <div id="conversationsList" class="conversations-scroll">
                    <!-- Populated dynamically via JS -->
                </div>
            </div>

            <!-- ── SCREEN 2: Chat Room Screen ── -->
            <div id="screenChat" class="screen-view" style="display: none;">
                <div class="chat-header">
                    <button class="btn-back" onclick="backToInbox()" title="Back to chats">
                        <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor">
                            <path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/>
                        </svg>
                    </button>
                    <div id="chatAvatar" class="chat-target-avatar admin">AD</div>
                    <div class="chat-header-info">
                        <span id="chatTargetName" class="chat-header-name">Admin</span>
                        <span id="chatTargetSub" class="chat-header-sub">Online • Private Channel</span>
                    </div>
                </div>

                <div id="mobileChatBody" class="mobile-chat-body">
                    <!-- Messages rendered dynamically via JS -->
                </div>

                <div class="mobile-footer">
                    <form onsubmit="sendMessage(event)" class="mobile-input-row">
                        <input type="text" id="mobileInput" class="mobile-input" placeholder="Message..." required autocomplete="off">
                        <button type="submit" class="mobile-send-btn" title="Send">
                            <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
                                <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
                            </svg>
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- External Navigation Links -->
    <div class="bottom-nav-links">
        <a href="{% url 'admin_panel' %}" class="nav-chip">🎛 Admin Control Hub</a>
        <a href="/dashboard/" class="nav-chip">💬 Chat Dashboard</a>
        <a href="{% url 'admin_peer_permissions' %}" class="nav-chip">🔐 Peer Permissions</a>
        <a href="{% url 'admin_groups' %}" class="nav-chip">👥 Group Manager</a>
    </div>

    <script>
        // ── State Management ──
        let currentUserId = "{{ active_friend.user_id }}";
        let currentApiKey = "{{ active_friend.api_key }}";
        let currentFriendName = "{{ active_friend.display_name }}";

        let currentTab = 'all';
        let currentSearch = '';
        let currentMode = 'full';

        // activeTarget: null when in Inbox; otherwise { type: 'admin'|'peer'|'group', id: string, slug?: string, name: string, sub: string }
        let activeTarget = null;

        // Cached datasets
        let cachedContacts = [];
        let cachedGroups = [];

        // Clock display
        function updateClock() {
            const now = new Date();
            const timeStr = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            const clockEl = document.getElementById('statusBarClock');
            if (clockEl) clockEl.innerText = timeStr;
        }
        setInterval(updateClock, 1000);
        updateClock();

        // ── Friend Switching ──
        function switchFriend() {
            const select = document.getElementById('friendSelect');
            const option = select.options[select.selectedIndex];
            currentUserId = option.value;
            currentApiKey = option.getAttribute('data-key');
            currentFriendName = option.getAttribute('data-name');

            document.getElementById('displayApiKey').innerText = currentApiKey;
            document.getElementById('inboxFriendName').innerText = currentFriendName;

            // Reset search
            document.getElementById('searchInput').value = '';
            currentSearch = '';

            if (currentMode === 'direct') {
                openAdminChat();
            } else {
                activeTarget = null;
                showInboxScreen();
                loadInbox();
            }
        }

        // ── Mode Switching ──
        function switchMode() {
            currentMode = document.getElementById('modeSelect').value;
            if (currentMode === 'direct') {
                openAdminChat();
            } else {
                backToInbox();
            }
        }

        function copyApiKey() {
            navigator.clipboard.writeText(currentApiKey).then(() => {
                alert('API Key copied to clipboard!');
            }).catch(() => {
                prompt('Copy API Key:', currentApiKey);
            });
        }

        // ── Screen Navigation ──
        function showInboxScreen() {
            document.getElementById('screenInbox').style.display = 'flex';
            document.getElementById('screenChat').style.display = 'none';
        }

        function showChatScreen() {
            document.getElementById('screenInbox').style.display = 'none';
            document.getElementById('screenChat').style.display = 'flex';
        }

        function backToInbox() {
            activeTarget = null;
            showInboxScreen();
            loadInbox();
        }

        function setTab(tab) {
            currentTab = tab;
            document.getElementById('tabAll').classList.toggle('active', tab === 'all');
            document.getElementById('tabPeers').classList.toggle('active', tab === 'peers');
            document.getElementById('tabGroups').classList.toggle('active', tab === 'groups');
            renderInboxList();
        }

        function handleSearch() {
            currentSearch = document.getElementById('searchInput').value.trim().toLowerCase();
            renderInboxList();
        }

        // ── Direct Admin Chat Shortcut ──
        function openAdminChat() {
            openChat('admin', 'admin', null, 'Admin', 'Online • Official Channel');
        }

        // ── Open Chat Room ──
        function openChat(type, id, slug, name, sub) {
            activeTarget = { type, id, slug, name, sub };

            // Update chat header
            const avatarEl = document.getElementById('chatAvatar');
            avatarEl.className = 'chat-target-avatar ' + type;
            avatarEl.innerText = getInitials(name);

            document.getElementById('chatTargetName').innerText = name;
            document.getElementById('chatTargetSub').innerText = sub;
            document.getElementById('mobileInput').placeholder = `Message ${name}...`;

            showChatScreen();
            loadMessages();
        }

        function getInitials(str) {
            if (!str) return '??';
            const parts = str.trim().split(/\s+/);
            if (parts.length >= 2) return (parts[0][0] + parts[1][0]).toUpperCase();
            return str.substring(0, 2).toUpperCase();
        }

        // ── Fetch & Render Inbox ──
        async function loadInbox() {
            if (activeTarget !== null) return; // Don't reload inbox if currently chatting

            try {
                // Concurrently fetch contacts and groups
                const [contactsRes, groupsRes] = await Promise.all([
                    fetch('/api/contacts/', {
                        headers: { 'X-USER-ID': currentUserId, 'X-API-KEY': currentApiKey }
                    }),
                    fetch('/api/groups/', {
                        headers: { 'X-USER-ID': currentUserId, 'X-API-KEY': currentApiKey }
                    })
                ]);

                if (contactsRes.ok) {
                    cachedContacts = await contactsRes.json();
                } else {
                    cachedContacts = [];
                }

                if (groupsRes.ok) {
                    cachedGroups = await groupsRes.json();
                } else {
                    cachedGroups = [];
                }

                renderInboxList();
            } catch (err) {
                console.error('Failed to load inbox:', err);
            }
        }

        function renderInboxList() {
            const listEl = document.getElementById('conversationsList');
            let items = [];

            // 1. Process contacts (Admin + Peers)
            cachedContacts.forEach(contact => {
                const isAdmin = (contact.user_id === 'admin');
                const type = isAdmin ? 'admin' : 'peer';
                const sub = isAdmin ? 'Online • Official Channel' : 'Peer Contact • Online';

                items.push({
                    type: type,
                    id: contact.user_id,
                    slug: null,
                    name: contact.display_name,
                    sub: sub,
                    lastMessage: contact.last_message ? contact.last_message.text : 'Tap to start conversation',
                    lastTime: contact.last_message ? formatTime(contact.last_message.created_at) : '',
                    unread: contact.unread_count || 0
                });
            });

            // 2. Process groups
            cachedGroups.forEach(group => {
                items.push({
                    type: 'group',
                    id: group.slug,
                    slug: group.slug,
                    name: group.name,
                    sub: `Group • ${group.member_count} members`,
                    lastMessage: group.last_message ? (group.last_message.sender_name + ': ' + group.last_message.text) : (group.description || 'No messages yet'),
                    lastTime: group.last_message ? formatTime(group.last_message.created_at) : '',
                    unread: group.unread_count || 0
                });
            });

            // Update Tab Counts
            const peerCount = items.filter(i => i.type === 'peer').length;
            const groupCount = items.filter(i => i.type === 'group').length;
            document.getElementById('badgeAll').innerText = items.length;
            document.getElementById('badgePeers').innerText = peerCount;
            document.getElementById('badgeGroups').innerText = groupCount;

            // Apply Tab Filtering
            if (currentTab === 'peers') {
                items = items.filter(i => i.type === 'peer' || i.type === 'admin');
            } else if (currentTab === 'groups') {
                items = items.filter(i => i.type === 'group');
            }

            // Apply Search Filtering
            if (currentSearch) {
                items = items.filter(i =>
                    i.name.toLowerCase().includes(currentSearch) ||
                    i.lastMessage.toLowerCase().includes(currentSearch)
                );
            }

            if (items.length === 0) {
                listEl.innerHTML = `
                    <div class="empty-inbox">
                        <div style="font-size: 28px; margin-bottom: 8px;">📭</div>
                        <p>No conversations found.</p>
                        <p style="font-size: 11.5px; margin-top: 6px; color: var(--sim-muted);">
                            ${cachedContacts.length <= 1 && cachedGroups.length === 0 ? 'By default, only the Admin is in your contact list. Use <strong>Peer Permissions</strong> or <strong>Group Manager</strong> in Control Hub to enable peer or group chats.' : ''}
                        </p>
                    </div>
                `;
                return;
            }

            listEl.innerHTML = items.map(item => {
                const avatarClass = item.type;
                const initials = getInitials(item.name);
                const tagLabel = item.type === 'admin' ? 'Admin' : (item.type === 'peer' ? 'Peer' : 'Group');
                const badgeHtml = item.unread > 0 ? `<span class="unread-badge">${item.unread}</span>` : '';
                const badgeIcon = item.type === 'admin' ? '👑' : (item.type === 'group' ? '👥' : '👤');

                return `
                    <div class="chat-item" onclick="openChat('${escapeJs(item.type)}', '${escapeJs(item.id)}', '${escapeJs(item.slug || '')}', '${escapeJs(item.name)}', '${escapeJs(item.sub)}')">
                        <div class="item-avatar ${avatarClass}">
                            ${initials}
                            <span class="avatar-badge-icon">${badgeIcon}</span>
                        </div>
                        <div class="item-content">
                            <div class="item-top">
                                <div class="item-name">
                                    <span>${escapeHtml(item.name)}</span>
                                    <span class="type-tag ${item.type}">${tagLabel}</span>
                                </div>
                                <span class="item-time">${item.lastTime}</span>
                            </div>
                            <div class="item-bottom">
                                <span class="item-snippet">${escapeHtml(item.lastMessage)}</span>
                                ${badgeHtml}
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // ── Load Messages for Active Target ──
        async function loadMessages() {
            if (!activeTarget) return;

            try {
                let url = '';
                let seenUrl = '';
                let seenBody = {};

                if (activeTarget.type === 'admin' || activeTarget.type === 'peer') {
                    url = `/api/messages/?user=${encodeURIComponent(activeTarget.id)}`;
                    seenUrl = '/api/messages/seen/';
                    seenBody = { user: activeTarget.id };
                } else if (activeTarget.type === 'group') {
                    url = `/api/groups/${encodeURIComponent(activeTarget.slug)}/messages/`;
                    seenUrl = `/api/groups/${encodeURIComponent(activeTarget.slug)}/seen/`;
                    seenBody = {};
                }

                // Send seen receipt
                fetch(seenUrl, {
                    method: 'POST',
                    headers: {
                        'X-USER-ID': currentUserId,
                        'X-API-KEY': currentApiKey,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(seenBody)
                }).catch(() => {});

                // Fetch conversation
                const res = await fetch(url, {
                    headers: {
                        'X-USER-ID': currentUserId,
                        'X-API-KEY': currentApiKey
                    }
                });

                if (!res.ok) {
                    throw new Error('Failed to load conversation (Status ' + res.status + ')');
                }

                const messages = await res.json();
                renderMessages(messages);
            } catch (err) {
                console.error(err);
                const container = document.getElementById('mobileChatBody');
                container.innerHTML = `<div style="color: #f15c6d; text-align: center; margin-top: 30px; font-size: 13px;">Failed to load messages.<br><span style="font-size:11px; opacity:0.8;">${escapeHtml(err.message)}</span></div>`;
            }
        }

        function renderMessages(messages) {
            const container = document.getElementById('mobileChatBody');
            if (messages.length === 0) {
                container.innerHTML = `
                    <div class="date-chip">Today</div>
                    <div style="text-align: center; color: var(--sim-muted); font-size: 12.5px; margin-top: 40px;">
                        No messages yet.<br>Send a message below to start chatting!
                    </div>
                `;
                return;
            }

            container.innerHTML = '<div class="date-chip">Today</div>' + messages.map(m => {
                const isMe = (m.sender === currentUserId);
                const time = formatTime(m.created_at);

                let senderNameHtml = '';
                if (!isMe && activeTarget.type === 'group') {
                    const senderLabel = m.sender_name || m.sender;
                    senderNameHtml = `<div class="msg-sender-tag">${escapeHtml(senderLabel)}</div>`;
                }

                const ticksHtml = isMe ? '<span class="check-ticks">✓✓</span>' : '';

                return `
                    <div class="mob-msg ${isMe ? 'outgoing' : 'incoming'}">
                        ${senderNameHtml}
                        <div>${escapeHtml(m.text)}</div>
                        <div class="mob-meta">
                            <span>${time}</span>
                            ${ticksHtml}
                        </div>
                    </div>
                `;
            }).join('');

            container.scrollTop = container.scrollHeight;
        }

        // ── Send Message ──
        async function sendMessage(e) {
            e.preventDefault();
            if (!activeTarget) return;

            const input = document.getElementById('mobileInput');
            const text = input.value.trim();
            if (!text) return;
            input.value = '';

            try {
                let sendUrl = '';
                let payload = { text: text };

                if (activeTarget.type === 'admin' || activeTarget.type === 'peer') {
                    sendUrl = '/api/messages/send/';
                    payload.receiver = activeTarget.id;
                } else if (activeTarget.type === 'group') {
                    sendUrl = `/api/groups/${encodeURIComponent(activeTarget.slug)}/send/`;
                }

                const res = await fetch(sendUrl, {
                    method: 'POST',
                    headers: {
                        'X-USER-ID': currentUserId,
                        'X-API-KEY': currentApiKey,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(payload)
                });

                if (!res.ok) {
                    const errData = await res.json().catch(() => ({}));
                    alert('Error sending message: ' + (errData.detail || 'Access denied or network error.'));
                    return;
                }

                loadMessages();
            } catch (err) {
                alert('Network error sending message.');
            }
        }

        function formatTime(isoStr) {
            if (!isoStr) return '';
            try {
                const d = new Date(isoStr);
                return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            } catch (e) {
                return '';
            }
        }

        function escapeHtml(str) {
            if (!str) return '';
            return String(str).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }

        function escapeJs(str) {
            if (!str) return '';
            return String(str).replace(/'/g, "\\'").replace(/"/g, '\\"');
        }

        // ── Polling Engine ──
        function runPollingCycle() {
            if (activeTarget !== null) {
                loadMessages();
            } else {
                loadInbox();
            }
        }

        // Initial setup
        loadInbox();
        setInterval(runPollingCycle, 3000);
    </script>
</body>
</html>
