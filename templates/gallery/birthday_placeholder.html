<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A new wish is coming…</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #0a0a2e 0%, #1a0b2e 100%);
            color: #e9edef;
            font-family: system-ui, -apple-system, sans-serif;
            text-align: center;
        }
        .wrap { padding: 24px; }
        .cake { font-size: 64px; }
        h1 {
            font-size: 26px;
            font-weight: 600;
            background: linear-gradient(to right, #ffd700, #ffa500);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        p { color: #8696a0; }
    </style>
</head>
<body>
<div class="wrap">
    <div class="cake">🎂</div>
    <h1>A new wish is being prepared…</h1>
    <p>Come back soon.</p>
</div>
</body>
</html>
